<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Scolweb Sync</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1115;
            color: #e6e6e6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1d24;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
        p.sub { color: #9aa0aa; margin-top: 0; margin-bottom: 1.8rem; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #c7cad1; }
        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid #2c303a;
            background: #12141a;
            color: #e6e6e6;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: #5b8def; }
        button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            background: #5b8def;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4a7bd8; }
        button:disabled { background: #3a4050; cursor: wait; }
        .error {
            background: #3a1f1f;
            border: 1px solid #7a3b3b;
            color: #f2b8b8;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }
        .loading-note {
            font-size: 0.8rem;
            color: #9aa0aa;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Connexion</h1>
        <p class="sub">Identifiants scolweb — seulement demandés une fois.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" id="loginForm">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" autocomplete="username" required />

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />

            <button type="submit" id="submitBtn">Se connecter</button>
        </form>
        <p class="loading-note" id="loadingNote" style="display:none">
            Connexion en cours (peut prendre quelques secondes la première fois)...
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function () {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = 'Connexion...';
            document.getElementById('loadingNote').style.display = 'block';
        });
    </script>
</body>
</html>
